<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Our Work – Legends Infra</title>
<link rel="stylesheet" href="style.css"/>
<style>
.media-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:10px;
}
.media-card {
  position:relative; overflow:hidden; border-radius:4px;
  background:var(--green-pale); cursor:pointer; aspect-ratio:4/3;
}
.media-card img {
  width:100%; height:100%; object-fit:cover; display:block;
  transition:transform .4s ease;
}
.media-card:hover img { transform:scale(1.05); }
.play-btn {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(27,58,44,.25);
}
.play-btn div {
  width:52px; height:52px; background:rgba(27,58,44,.8);
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  transition:transform .3s;
}
.media-card:hover .play-btn div { transform:scale(1.1); }
.media-placeholder {
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center; font-size:3rem;
}
.loading-state { grid-column:1/-1; text-align:center; padding:4rem; color:var(--text-l); }

/* LIGHTBOX */
.lightbox {
  position:fixed; inset:0; z-index:500; background:rgba(0,0,0,.93);
  display:none; align-items:center; justify-content:center; padding:1rem;
}
.lightbox.open { display:flex; }
.lb-media-wrap { max-width:92vw; max-height:88vh; display:flex; align-items:center; justify-content:center; }
.lb-media-wrap img { max-width:92vw; max-height:88vh; object-fit:contain; border-radius:3px; display:block; }
.lb-media-wrap video { max-width:92vw; max-height:88vh; border-radius:3px; background:#000; }
.lb-close {
  position:fixed; top:1rem; right:1.2rem; background:rgba(255,255,255,.15);
  border:none; color:#fff; width:38px; height:38px; border-radius:50%;
  cursor:pointer; font-size:1.2rem; display:flex; align-items:center; justify-content:center;
  transition:background .3s; z-index:10;
}
.lb-close:hover { background:rgba(255,255,255,.3); }
.lb-nav {
  position:fixed; top:50%; transform:translateY(-50%);
  background:rgba(255,255,255,.12); border:none; color:#fff;
  width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:1.4rem;
  display:flex; align-items:center; justify-content:center; transition:background .3s; z-index:10;
}
.lb-nav:hover { background:rgba(255,255,255,.28); }
.lb-prev { left:.8rem; }
.lb-next { right:.8rem; }
.lb-counter {
  position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,.5); font-size:.78rem; letter-spacing:1px;
}
</style>
</head>
<body>

<div class="page-banner">
  <div class="page-banner-content reveal">
    <div class="breadcrumb"><a href="index.html">Home</a> / Our Work</div>
    <h1>Our <em>Work</em></h1>
    <p>Real projects. Real results. Updated live from our gallery.</p>
  </div>
</div>

<section>
  <div class="reveal" style="margin-bottom:2rem;">
    <div class="section-label">Portfolio</div>
    <div class="section-title">All <em>Projects</em></div>
    <div class="divider"></div>
  </div>
  <div class="media-grid" id="mediaGrid">
    <div class="loading-state">Loading projects...</div>
  </div>
  <div id="loadMoreWrap" style="text-align:center;margin-top:2rem;display:none;">
    <button onclick="loadMore()" style="background:var(--green);color:#fff;border:none;padding:.85rem 2.5rem;border-radius:2px;font-family:'Jost',sans-serif;font-size:.82rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;">Load More</button>
  </div>
</section>

<div class="cta-band reveal">
  <div>
    <h2>Like What<br>You <em>See?</em></h2>
    <p>Let's discuss your project — free consultation, zero pressure.</p>
  </div>
  <div class="cta-btns">
    <a href="tel:+919677029865" class="btn-brass">📞 Call Now</a>
    <a href="contact.html" class="btn-hero-outline">Send Enquiry</a>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLBOutside(event)">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <button class="lb-nav lb-prev" onclick="navigate(-1)">‹</button>
  <div class="lb-media-wrap" id="lbWrap"></div>
  <button class="lb-nav lb-next" onclick="navigate(1)">›</button>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<a href="https://wa.me/919677029865" class="wa-float" target="_blank">💬</a>
<script src="shared.js"></script>
<script>
const PAGE_SIZE = 12;
let allMedia = [];
let shown = 0;
let currentIndex = 0;

const SAMPLES = [
  {type:'image',url:'https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=900&q=80',thumb:'https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=500&q=70'},
  {type:'image',url:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=900&q=80',thumb:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=500&q=70'},
  {type:'image',url:'https://images.unsplash.com/photo-1581094271901-8022df4466f9?w=900&q=80',thumb:'https://images.unsplash.com/photo-1581094271901-8022df4466f9?w=500&q=70'},
  {type:'image',url:'https://images.unsplash.com/photo-1541888946425-d81bb19240f5?w=900&q=80',thumb:'https://images.unsplash.com/photo-1541888946425-d81bb19240f5?w=500&q=70'},
  {type:'image',url:'https://images.unsplash.com/photo-1590736969955-71cc94901144?w=900&q=80',thumb:'https://images.unsplash.com/photo-1590736969955-71cc94901144?w=500&q=70'},
  {type:'image',url:'https://images.unsplash.com/photo-1565008447742-97f6f38c985c?w=900&q=80',thumb:'https://images.unsplash.com/photo-1565008447742-97f6f38c985c?w=500&q=70'},
];

async function loadPosts() {
  const media = await getCloudinaryMedia('work', 200);
  allMedia = media.length > 0 ? media : SAMPLES;
  shown = 0;
  document.getElementById('mediaGrid').innerHTML = '';
  renderBatch();
}

function renderBatch() {
  const grid = document.getElementById('mediaGrid');
  const batch = allMedia.slice(shown, shown + PAGE_SIZE);
  if (batch.length === 0 && shown === 0) {
    grid.innerHTML = `<div class="loading-state">No projects yet — check back soon.</div>`;
    return;
  }
  batch.forEach((item, i) => {
    const globalIndex = shown + i;
    const card = document.createElement('div');
    card.className = 'media-card';
    card.onclick = () => openLB(globalIndex);
    if (item.type === 'video') {
      card.innerHTML = `
        <img src="${item.thumb}" alt="Work" loading="lazy" onerror="this.style.display='none'"/>
        <div class="play-btn"><div><svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg></div></div>`;
    } else {
      card.innerHTML = `<img src="${item.thumb}" alt="Legends Infra work" loading="lazy"/>`;
    }
    grid.appendChild(card);
  });
  shown += batch.length;
  document.getElementById('loadMoreWrap').style.display = shown < allMedia.length ? 'block' : 'none';
}

function loadMore() { renderBatch(); }

function openLB(index) {
  currentIndex = index;
  showLBItem();
  document.getElementById('lightbox').classList.add('open');
  document.addEventListener('keydown', handleKey);
}

function showLBItem() {
  const item = allMedia[currentIndex];
  const wrap = document.getElementById('lbWrap');
  wrap.innerHTML = item.type === 'video'
    ? `<video src="${item.url}" controls autoplay playsinline></video>`
    : `<img src="${item.url}" alt="Legends Infra work"/>`;
  document.getElementById('lbCounter').textContent = `${currentIndex + 1} / ${allMedia.length}`;
}

function navigate(dir) {
  const v = document.querySelector('#lbWrap video');
  if (v) v.pause();
  currentIndex = (currentIndex + dir + allMedia.length) % allMedia.length;
  showLBItem();
}

function closeLightbox() {
  const v = document.querySelector('#lbWrap video');
  if (v) v.pause();
  document.getElementById('lightbox').classList.remove('open');
  document.removeEventListener('keydown', handleKey);
}

function closeLBOutside(e) { if (e.target === document.getElementById('lightbox')) closeLightbox(); }
function handleKey(e) {
  if (e.key === 'ArrowRight') navigate(1);
  else if (e.key === 'ArrowLeft') navigate(-1);
  else if (e.key === 'Escape') closeLightbox();
}

document.addEventListener('DOMContentLoaded', loadPosts);
</script>
</body>
</html>
