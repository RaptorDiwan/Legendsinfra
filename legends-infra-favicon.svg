<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#1B3A2C"/>
  <!-- Brass top accent bar -->
  <rect x="0" y="0" width="512" height="14" rx="7" fill="#B8945A" opacity="0.7"/>
  <!-- L — white -->
  <text x="140" y="352"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="320" font-weight="400"
    fill="#ffffff"
    text-anchor="middle">L</text>
  <!-- I — brass -->
  <text x="340" y="352"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="320" font-weight="400"
    fill="#B8945A"
    text-anchor="middle">I</text>
  <!-- Brass underline -->
  <rect x="64" y="405" width="384" height="4" rx="2" fill="#B8945A" opacity="0.45"/>
  <!-- INFRA micro label -->
  <text x="256" y="468"
    font-family="Arial, Helvetica, sans-serif"
    font-size="36" font-weight="500"
    fill="rgba(255,255,255,0.38)"
    text-anchor="middle"
    letter-spacing="10">INFRA</text>
</svg>
